name: CompileTest


on:
  pull_request:
    branches: [master, main]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: .
      - uses: actions/checkout@v4
        with:
          repository: bayescollab/BayesShip
          path: .
      - uses: actions/checkout@v4
        with:
          repository: bayescollab/GWATDocker
          path: .

      - name: Problem Matcher
        run:
          ls -la
          echo "::add-matcher::$GITHUB_WORKSPACE/gw_analysis_tools/.github/workflows/compile_problem_matcher.json"
      - name: Set up Container and Compile Code
        run: |
          docker build -t gwatubuntu -f GWATDocker/Dockerfile.gwatubuntu .
          docker build --target bayes-build -t gwat_dev -f GWATDocker/Dockerfile.gwat.bayesship .
          docker run --rm --mount type=bind,source=$GITHUB_WORKSPACE/gw_analysis_tools,target="/opt/gw_analysis_tools" gwat_dev bash -c "
            cd /opt/gw_analysis_tools && \
            mkdir -p build && cd build && \
            rm -rf * && \
            cmake -DCMAKE_INSTALL_PREFIX=/usr/local ../ && \
            make -j 4 && make install
          "
          